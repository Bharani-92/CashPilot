<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b3d3a">
  <meta name="description" content="CashPilot - Simple financial management for independent home tutors.">

  <title>CashPilot | Business Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <span class="logo">
        <i class="fa-solid fa-wallet"></i>
      </span>

      <div class="brand-info">
        <h1>CashPilot</h1>
        <span>Your business, under control.</span>
      </div>

    </div>

    <!-- NAVIGATION -->
    <nav>

      <button data-tab="dashboard" class="active">
        <i class="fa-solid fa-chart-pie"></i>
        Dashboard
      </button>

      <button data-tab="customers">
        <i class="fa-solid fa-users"></i>
        Customers
      </button>

      <button data-tab="invoices">
        <i class="fa-solid fa-file-invoice"></i>
        Invoices
      </button>

      <button data-tab="forecast">
        <i class="fa-solid fa-chart-line"></i>
        Cash Forecast
      </button>

    </nav>

    <!-- HEADER ACTIONS -->
    <div class="header-actions">

      <button class="notification-btn"
              type="button"
              title="Notifications"
              aria-label="Notifications">
        <i class="fa-regular fa-bell"></i>
      </button>

      <div class="profile-icon" title="CashPilot User">
        <i class="fa-solid fa-user"></i>
      </div>

    </div>

  </header>


  <!-- MAIN APPLICATION -->
  <main id="main">

    <!-- JavaScript dynamically renders application screens here -->

  </main>


  <!-- FOOTER -->
  <footer class="app-footer">

    <p>
      <strong>CashPilot</strong> &copy; 2026
      <span>Made for independent business owners.</span>
    </p>

    <p class="footer-version">
      Version 1.0
    </p>

  </footer>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
